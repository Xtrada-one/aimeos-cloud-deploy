services:
  app:
    build:
      context: .
      target: app
    container_name: aimeos-app
    restart: unless-stopped
    env_file: .env

  web:
    build:
      context: .
      target: web
    container_name: aimeos-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
